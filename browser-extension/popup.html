<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study OS</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #000000;
      color: #ededed;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #52525b;
    }
    .status-dot.active {
      background-color: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }
    .card {
      background-color: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .text-sm { font-size: 14px; }
    .text-xs { font-size: 12px; color: #a1a1aa; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 8px 12px;
      background-color: #ededed;
      color: #000;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }
    .btn:hover { background-color: #d4d4d8; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>
    <div id="status-dot" class="status-dot"></div>
    Study OS
  </h1>

  <div id="not-connected" class="card">
    <p class="text-sm" style="margin-top:0;">Not connected</p>
    <p class="text-xs" style="margin-bottom:12px;">Open Study OS in a tab to connect.</p>
    <a href="https://study-os-five-tau.vercel.app" target="_blank" class="btn">Open Study OS</a>
  </div>

  <div id="connected" class="card hidden">
    <p class="text-sm" style="margin-top:0;" id="session-status">Waiting for timer...</p>
    <p class="text-xs" style="margin-bottom:0;" id="distraction-count">Distractions logged: 0</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
